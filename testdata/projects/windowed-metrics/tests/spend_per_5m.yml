# Five-minute windows, a one-minute watermark delay. A window's row is final:
# it is emitted once, when an event moves the watermark to the window's last
# millisecond, and never again. Nothing is emitted for a window that is still
# open when the fixture ends (the order at 10:11).
model: spend_per_5m

given:
  - { customer_id: 42, amount: 60,  ordered_at: "2026-08-30T10:01:00Z" }
  - { customer_id: 7,  amount: 15,  ordered_at: "2026-08-30T10:02:00Z" }
  - { customer_id: 42, amount: 50,  ordered_at: "2026-08-30T10:04:59Z" }
  # watermark 10:05:00: the 10:00 window closes, both customers at once
  - { customer_id: 42, amount: 30,  ordered_at: "2026-08-30T10:06:00Z" }
  - { customer_id: 7,  amount: 120, ordered_at: "2026-08-30T10:09:59.999Z" }
  # watermark 10:10:00: the 10:05 window closes
  - { customer_id: 42, amount: 10,  ordered_at: "2026-08-30T10:11:00Z" }

expect:
  - { op: insert, customer_id: 7,  window_start: "2026-08-30T10:00:00Z", window_end: "2026-08-30T10:05:00Z", total_spend: 15,  orders: 1 }
  - { op: insert, customer_id: 42, window_start: "2026-08-30T10:00:00Z", window_end: "2026-08-30T10:05:00Z", total_spend: 110, orders: 2 }
  - { op: insert, customer_id: 7,  window_start: "2026-08-30T10:05:00Z", window_end: "2026-08-30T10:10:00Z", total_spend: 120, orders: 1 }
  - { op: insert, customer_id: 42, window_start: "2026-08-30T10:05:00Z", window_end: "2026-08-30T10:10:00Z", total_spend: 30,  orders: 1 }
